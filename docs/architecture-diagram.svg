<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles -->
  <defs>
    <style>
      .layer-label { font-size: 14px; font-weight: bold; fill: #333; }
      .component-box { fill: #e8f4f8; stroke: #2196F3; stroke-width: 2; }
      .component-text { font-size: 13px; fill: #1565c0; font-weight: bold; }
      .component-detail { font-size: 11px; fill: #555; }
      .external-box { fill: #fff3e0; stroke: #ff9800; stroke-width: 2; }
      .external-text { font-size: 13px; fill: #e65100; font-weight: bold; }
      .database-box { fill: #f3e5f5; stroke: #9c27b0; stroke-width: 2; }
      .database-text { font-size: 13px; fill: #6a1b9a; font-weight: bold; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-label { font-size: 11px; fill: #666; }
      .dashed-arrow { stroke: #999; stroke-width: 1.5; fill: none; stroke-dasharray: 5,5; marker-end: url(#arrowhead-gray); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#999" />
    </marker>
  </defs>

  <!-- Background layers -->
  <rect x="0" y="0" width="1400" height="120" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="20" y="25" class="layer-label">USER INTERACTION LAYER</text>

  <rect x="0" y="120" width="1400" height="400" fill="#f9f9f9" stroke="#ccc" stroke-width="1"/>
  <text x="20" y="145" class="layer-label">APPLICATION LAYER (Backend)</text>

  <rect x="0" y="520" width="1400" height="380" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  <text x="20" y="545" class="layer-label">EXTERNAL SYSTEMS & STORAGE</text>

  <!-- User & Frontend -->
  <circle cx="100" cy="60" r="35" fill="#4CAF50" stroke="#2e7d32" stroke-width="2"/>
  <text x="65" y="70" style="font-size: 14px; fill: white; font-weight: bold;">USER</text>

  <rect x="250" y="20" width="300" height="80" class="component-box"/>
  <text x="270" y="45" class="component-text">React Frontend</text>
  <text x="270" y="65" class="component-detail">• Configuration Panel</text>
  <text x="270" y="80" class="component-detail">• Manual Collection Trigger</text>
  <text x="270" y="95" class="component-detail">Port: 3000 | REST Client</text>

  <!-- Arrow User to Frontend -->
  <path d="M 135 60 L 250 60" class="arrow"/>
  <text x="180" y="55" class="arrow-label">Interacts</text>

  <!-- Backend REST API -->
  <rect x="100" y="170" width="320" height="100" class="component-box"/>
  <text x="120" y="195" class="component-text">Spring Boot REST API</text>
  <text x="120" y="215" class="component-detail">• ConfigController (/v1/config)</text>
  <text x="120" y="230" class="component-detail">• CollectionController (/v1/collect)</text>
  <text x="120" y="245" class="component-detail">• HistoryController (/v1/history)</text>
  <text x="120" y="260" class="component-detail">Port: 8080 | JSON Endpoints</text>

  <!-- Arrow Frontend to API -->
  <path d="M 400 100 L 270 170" class="arrow"/>
  <text x="380" y="130" class="arrow-label">HTTP/JSON</text>

  <!-- Config Service -->
  <rect x="100" y="310" width="150" height="90" class="component-box"/>
  <text x="115" y="335" class="component-text">ConfigService</text>
  <text x="115" y="355" class="component-detail">• Save/Load Config</text>
  <text x="115" y="370" class="component-detail">• Encrypt Credentials</text>
  <text x="115" y="385" class="component-detail">• Manage Settings</text>

  <!-- Metrics Collection Service -->
  <rect x="300" y="310" width="180" height="90" class="component-box"/>
  <text x="315" y="335" class="component-text">MetricsCollectionService</text>
  <text x="315" y="355" class="component-detail">• Orchestrate Collection</text>
  <text x="315" y="370" class="component-detail">• Parse JSON Response</text>
  <text x="315" y="385" class="component-detail">• Publish to Splunk</text>

  <!-- Scheduling Service -->
  <rect x="530" y="310" width="160" height="90" class="component-box"/>
  <text x="545" y="335" class="component-text">SchedulingConfig</text>
  <text x="545" y="355" class="component-detail">• Dynamic Scheduling</text>
  <text x="545" y="370" class="component-detail">• ThreadPoolScheduler</text>
  <text x="545" y="385" class="component-detail">• Interval Management</text>

  <!-- Arrows from API to Services -->
  <path d="M 200 270 L 175 310" class="arrow"/>
  <path d="M 260 270 L 360 310" class="arrow"/>
  <path d="M 310 270 L 590 310" class="arrow"/>

  <!-- API Clients -->
  <rect x="780" y="310" width="160" height="90" class="component-box"/>
  <text x="795" y="335" class="component-text">StriimApiClient</text>
  <text x="795" y="355" class="component-detail">• /security/authenticate</text>
  <text x="795" y="370" class="component-detail">• /api/v2/tungsten (mon)</text>
  <text x="795" y="385" class="component-detail">• Token Caching</text>

  <rect x="990" y="310" width="160" height="90" class="component-box"/>
  <text x="1005" y="335" class="component-text">SplunkHecClient</text>
  <text x="1005" y="355" class="component-detail">• HTTP Event Collector</text>
  <text x="1005" y="370" class="component-detail">• Token Authorization</text>
  <text x="1005" y="385" class="component-detail">• Metrics Publishing</text>

  <!-- Arrows to API Clients -->
  <path d="M 480 350 L 780 350" class="arrow"/>
  <path d="M 480 350 L 990 350" class="dashed-arrow"/>
  <text x="610" y="340" class="arrow-label">Executes</text>
  <text x="720" y="340" class="arrow-label">Publishes</text>

  <!-- PostgreSQL Database -->
  <rect x="1200" y="310" width="160" height="90" class="database-box"/>
  <text x="1215" y="335" class="database-text">PostgreSQL</text>
  <text x="1215" y="355" class="component-detail">• system_config</text>
  <text x="1215" y="370" class="component-detail">• execution_history</text>
  <text x="1215" y="385" class="component-detail">Port: 5432</text>

  <!-- Arrows to Database -->
  <path d="M 250 350 L 1200 350" class="dashed-arrow"/>
  <path d="M 390 400 L 1260 400" class="dashed-arrow"/>
  <text x="680" y="345" class="arrow-label">Read/Write Config</text>

  <!-- External Systems - Striim -->
  <rect x="100" y="630" width="280" height="120" class="external-box"/>
  <text x="120" y="660" class="external-text">Striim Server</text>
  <text x="120" y="685" class="component-detail">📍 External System</text>
  <text x="120" y="705" class="component-detail">• Authentication Endpoint</text>
  <text x="120" y="720" class="component-detail">  POST /security/authenticate</text>
  <text x="120" y="735" class="component-detail">• Mon Command Execution</text>
  <text x="120" y="750" class="component-detail">  POST /api/v2/tungsten</text>

  <!-- Arrow to Striim -->
  <path d="M 240 400 L 240 630" class="arrow"/>
  <text x="250" y="520" class="arrow-label">Form-Encoded Auth</text>
  <text x="270" y="535" class="arrow-label">& Mon Commands</text>

  <!-- External Systems - Splunk HEC -->
  <rect x="500" y="630" width="280" height="120" class="external-box"/>
  <text x="520" y="660" class="external-text">Splunk HTTP Event Collector</text>
  <text x="520" y="685" class="component-detail">📍 External System (Port 8088)</text>
  <text x="520" y="705" class="component-detail">• Token Authentication</text>
  <text x="520" y="720" class="component-detail">• JSON Event Ingestion</text>
  <text x="520" y="735" class="component-detail">• Sourcetype: _json</text>
  <text x="520" y="750" class="component-detail">• Index: striim_app_mon</text>

  <!-- Arrow to Splunk HEC -->
  <path d="M 1070 400 L 700 630" class="arrow"/>
  <text x="850" y="510" class="arrow-label">Metrics (JSON)</text>
  <text x="870" y="525" class="arrow-label">Bearer Token</text>

  <!-- Splunk Index -->
  <rect x="900" y="630" width="280" height="120" class="external-box"/>
  <text x="920" y="660" class="external-text">Splunk Index</text>
  <text x="920" y="685" class="component-detail">📍 Data Storage</text>
  <text x="920" y="705" class="component-detail">• striim_app_mon Index</text>
  <text x="920" y="720" class="component-detail">• Structured Metrics</text>
  <text x="920" y="735" class="component-detail">• Application Events</text>
  <text x="920" y="750" class="component-detail">• Status Breakdown Data</text>

  <!-- Arrow from HEC to Index -->
  <path d="M 640 750 L 900 750" class="arrow"/>
  <text x="750" y="745" class="arrow-label">Index Events</text>

  <!-- Splunk Dashboard -->
  <rect x="1250" y="630" width="120" height="120" class="external-box"/>
  <text x="1260" y="660" class="external-text">Dashboard</text>
  <text x="1260" y="685" class="component-detail">• Queries Index</text>
  <text x="1260" y="700" class="component-detail">• 9 Panels</text>
  <text x="1260" y="715" class="component-detail">• Charts &amp;</text>
  <text x="1260" y="730" class="component-detail">  Tables</text>
  <text x="1260" y="745" class="component-detail">• Port: 8000</text>

  <!-- Arrow from Index to Dashboard -->
  <path d="M 1050 690 L 1250 690" class="arrow"/>
  <text x="1130" y="685" class="arrow-label">Query &amp; Aggregate</text>

  <!-- Browser View -->
  <circle cx="1310" cy="800" r="35" fill="#4CAF50" stroke="#2e7d32" stroke-width="2"/>
  <text x="1270" y="810" style="font-size: 12px; fill: white; font-weight: bold;">BROWSER</text>

  <!-- Arrow from Dashboard to Browser -->
  <path d="M 1310 750 L 1310 765" class="arrow"/>
  <text x="1320" y="760" class="arrow-label">Render</text>

  <!-- Data Flow Summary Box -->
  <rect x="50" y="800" width="1300" height="80" fill="#e3f2fd" stroke="#2196F3" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="70" y="825" style="font-size: 12px; font-weight: bold; fill: #1565c0;">Data Flow Summary:</text>
  <text x="70" y="845" style="font-size: 11px; fill: #333;">1️⃣ User configures via Frontend → 2️⃣ Backend authenticates with Striim → 3️⃣ Executes mon commands → 4️⃣ Parses metrics & counts → 5️⃣ Stores in DB → 6️⃣ Publishes to Splunk HEC → 7️⃣ Splunk indexes events → 8️⃣ Dashboard queries & visualizes → 9️⃣ User views real-time metrics</text>
</svg>
