services:
  postgres:
    image: postgres:15-alpine
    container_name: striim-connector-db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: striim_connector
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db/migration/V1__initial_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - striim-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: striim-connector-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/striim_connector
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      STRIIM_METRICS_COLLECTION_INTERVAL_SECONDS: ${COLLECTION_INTERVAL:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_started
    networks:
      - striim-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: striim-connector-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - striim-network

volumes:
  postgres_data:

networks:
  striim-network:
    driver: bridge
